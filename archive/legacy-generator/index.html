<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小角生成器</title>
<style>
  :root {
    --paper: #FFFFFF;
    --page: #F7F6F2;
    --tile: #C8CAC7;
    --ink: #222222;
    --ink-2: #6F6F69;
    --hairline: #E9E6DF;
    --accent-ui: #D44A36;
    --cream: #F3EBDF;
    --wash: #FAF8F4;
    --shadow: 0 14px 36px rgba(37, 40, 37, .10);
    --r-tile: 14px;
    --r-card: 20px;
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0; padding: 20px 24px 40px; color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  a { color: inherit; }

  /* 品牌条 */
  .brand {
    max-width: 1160px; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand-left { display: flex; align-items: center; gap: 14px; }
  .brand-mark { width: 58px; height: 42px; display: block; }
  .brand-mark svg { display: block; width: 100%; height: 100%; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; display: flex; align-items: center; gap: 12px; }
  h1 b { font-weight: 800; }
  h1 .vbar { width: 1px; height: 20px; background: var(--ink); opacity: .35; }
  h1 span { font-weight: 700; }
  .brand-right { font-size: 12px; color: var(--ink-2); text-align: right; line-height: 1.7; }
  .brand-right b { color: var(--ink); font-weight: 700; }

  /* 主布局 */
  .app {
    max-width: 1160px; margin: 0 auto; display: grid;
    grid-template-columns: minmax(0, 1fr) 440px; gap: 20px; align-items: start;
  }
  @media (max-width: 960px) { .app { grid-template-columns: 1fr; } }

  /* 预览卡 */
  .stage-card {
    background: var(--paper); border-radius: var(--r-card); padding: 18px;
    box-shadow: var(--shadow); position: sticky; top: 16px;
  }
  .stage-base {
    border-radius: 16px; overflow: hidden; aspect-ratio: 780 / 560;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .2s ease;
  }
  .stage-base.tex {
    background-image: radial-gradient(rgba(34, 34, 34, .045) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .stage-base svg { display: block; width: 100%; height: 100%; }
  .stage-meta {
    margin-top: 12px; display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--ink-2);
  }
  .stage-meta .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage-meta .dim { font-variant-numeric: tabular-nums; }

  /* 控制面板 */
  .panel { display: flex; flex-direction: column; gap: 16px; }
  .block {
    background: var(--paper); border-radius: var(--r-card); padding: 16px 18px 18px;
    box-shadow: var(--shadow);
  }
  .block > h2 {
    margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: 1px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .block > h2 small { font-size: 11px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; }
  .block > h2 .clear-deco { margin-left: auto; padding: 4px 9px; font-size: 10px; font-weight: 400; }
  .group-label { font-size: 11px; font-weight: 700; color: var(--ink-2); margin: 12px 0 8px; letter-spacing: 1px; }
  .group-label:first-child { margin-top: 0; }

  /* 瓦片选择器 */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile {
    appearance: none; border: none; padding: 0; background: none; cursor: pointer;
    font-family: inherit; text-align: center;
  }
  .tile .art {
    display: block; border-radius: var(--r-tile); background: var(--tile);
    padding: 6%; transition: transform .18s cubic-bezier(.16, 1, .3, 1), box-shadow .18s ease, outline-color .12s ease;
    outline: 2px solid transparent; outline-offset: 2px;
  }
  .tile .art svg { display: block; width: 100%; height: auto; }
  .tile .name {
    display: block; margin-top: 6px; font-size: 11px; color: var(--ink-2); line-height: 1;
  }
  .tile:hover .art { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(37, 40, 37, .14); }
  .tile:active .art { transform: scale(.97); }
  .tile.on .art { outline-color: var(--ink); }
  .tile.on .name { color: var(--ink); font-weight: 700; }

  /* 配色卡与自定义取色 */
  .colorways { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .colorway {
    appearance: none; border: none; padding: 0; background: none; cursor: pointer; font-family: inherit;
  }
  .colorway .sw {
    display: block; border-radius: 12px; overflow: hidden; height: 46px;
    outline: 2px solid transparent; outline-offset: 2px;
    transition: transform .18s cubic-bezier(.16, 1, .3, 1), outline-color .12s ease;
    border: 1px solid rgba(34, 34, 34, .08);
  }
  .colorway .sw i { display: block; }
  .colorway .name { display: block; margin-top: 6px; font-size: 11px; color: var(--ink-2); line-height: 1; }
  .colorway:hover .sw { transform: translateY(-2px); }
  .colorway.on .sw { outline-color: var(--ink); }
  .colorway.on .name { color: var(--ink); font-weight: 700; }

  .custom-row {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline);
    display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
  }
  .pick { display: flex; flex-direction: column; gap: 5px; }
  .pick label { font-size: 11px; color: var(--ink-2); line-height: 1; }
  .pick input[type="color"] {
    appearance: none; -webkit-appearance: none; width: 40px; height: 32px;
    border: 1.5px solid var(--hairline); border-radius: 10px; padding: 2px;
    background: var(--paper); cursor: pointer;
  }
  .pick input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .pick input[type="color"]::-webkit-color-swatch { border: none; border-radius: 7px; }
  .pick input[type="color"]::-moz-color-swatch { border: none; border-radius: 7px; }
  .btn.mini {
    border-radius: 999px; padding: 7px 12px; font-size: 11px;
    background: var(--paper); color: var(--ink); border: 1.5px solid var(--hairline);
    appearance: none; cursor: pointer; font-family: inherit;
  }
  .btn.mini:hover { border-color: var(--ink); }
  .custom-hint { margin-top: 10px; font-size: 11px; color: var(--ink-2); }

  /* 操作 */
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    appearance: none; border: none; cursor: pointer; font-family: inherit;
    border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 700;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary { background: var(--accent-ui); color: #fff; box-shadow: 0 6px 16px rgba(212, 74, 54, .28); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 1.5px solid var(--hairline); font-weight: 400; }
  .btn.ghost:hover { border-color: var(--ink); }
  .btn.text { background: none; color: var(--ink-2); font-weight: 400; padding: 10px 8px; }
  .btn.text:hover { color: var(--ink); }
  .hint { margin-top: 10px; font-size: 11px; color: var(--ink-2); }
  #warn:empty { display: none; }
  #warn {
    margin-top: 10px; font-size: 12px; line-height: 1.6; color: #7a5b16;
    background: #FBF3DC; border-radius: 10px; padding: 8px 12px;
  }
  .export-status { min-height: 18px; margin-top: 8px; font-size: 11px; color: var(--ink-2); }
  .export-status.ok { color: #39704b; }
  .export-status.error { color: #9a3d2d; }
  details.rules { margin-top: 12px; font-size: 12px; color: var(--ink-2); }
  details.rules summary { cursor: pointer; font-size: 11px; letter-spacing: 1px; color: var(--ink-2); }
  details.rules p { margin: 8px 0 0; line-height: 1.9; }

  footer {
    max-width: 1160px; margin: 26px auto 0; font-size: 11.5px; color: var(--ink-2);
  }
  footer a { text-underline-offset: 3px; }
  footer code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }

  /* 图层进入动效 */
  @keyframes layerIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  svg g.anim { animation: layerIn .18s cubic-bezier(.16, 1, .3, 1) both; transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="brand">
  <div class="brand-left">
    <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
    <h1><b>小角</b><i class="vbar"></i><span>生成器</span></h1>
  </div>
  <div class="brand-right" id="comboCount"></div>
</header>

<main class="app">
  <section class="stage-card">
    <div class="stage-base" id="stageBase"></div>
    <div class="stage-meta">
      <span class="name" id="filename"></span>
      <button class="btn text" id="texToggle" style="padding:2px 6px;font-size:11px">底纹</button>
      <span class="dim">780 × 560</span>
    </div>
  </section>

  <aside class="panel">
    <section class="block">
      <h2>表情 <small>必选</small></h2>
      <div class="tiles" id="exprTiles"></div>
    </section>

    <section class="block">
      <h2>装饰 <small>同一挂点单选</small><button class="btn mini clear-deco" id="btnClearDeco" type="button">清空装饰</button></h2>
      <div id="decoGroups"></div>
    </section>

    <section class="block">
      <h2>配色 <small>体色、切角、眼睛均可换</small></h2>
      <div class="colorways" id="colorwayCards"></div>
      <div class="custom-row">
        <div class="pick"><label>身体</label><input type="color" id="pickBody" value="#F3EBDF"></div>
        <div class="pick"><label>切角</label><input type="color" id="pickCorner" value="#D44A36"></div>
        <div class="pick"><label>眼睛</label><input type="color" id="pickInk" value="#222222"></div>
        <div class="pick"><label>点缀</label><input type="color" id="pickAccent" value="#6EC6E8"></div>
        <div class="pick"><label>背景</label><input type="color" id="pickScene" value="#C8CAC7"></div>
        <button class="btn mini" id="btnClearScene">透明背景</button>
      </div>
      <div class="custom-hint">改动任意取色即进入自定义配色，选择上方色板可一键回到成套配色。</div>
    </section>

    <section class="block">
      <div class="actions">
        <button class="btn primary" id="btnSvg">导出 SVG</button>
        <button class="btn ghost" data-png="1024">PNG 1024</button>
        <button class="btn ghost" data-png="512">PNG 512</button>
        <button class="btn ghost" data-png="240">PNG 240</button>
        <button class="btn ghost" id="btnRandom" title="快捷键 R">随机组合</button>
        <button class="btn text" id="btnReset">重置</button>
      </div>
      <div id="warn"></div>
      <div class="export-status" id="exportStatus" role="status" aria-live="polite"></div>
      <details class="rules">
        <summary>组合规则</summary>
        <p>
          切角保护区禁入（D-1）；眼部仅眼镜类可覆盖（D-2、D-3）；内容不出画布安全区（D-4）；
          同一挂点一次只挂一件（C-1）。配色守恒：切角的形状不可遮挡，颜色自由；
          眼睛换色会联动眨眼、墨镜、泪滴与爱心眼；对比度过低的组合会给出提示。
        </p>
      </details>
    </section>
  </aside>
</main>

<footer>
  规范与拆解体系见 <a href="Design/README.md">Design/</a>　素材库 <a href="小角IP/README.md">小角IP/</a>　表情由 <code>scripts/extract_expressions.py</code> 逐字节校验后注入
</footer>

// 表情片段令牌化：素材中的内容色映射为令牌，随配色联动
//（#222222 眼睛/笔画、#D44A36 爱心眼、#6EC6E8 泪滴；基板色不经过片段）
(function normalizeFragments() {
  for (const e of (EXPRESSIONS.expressions || [])) {
    e.fragment = e.fragment
      .split("#222222").join("{{ink}}")
      .split("#D44A36").join("{{corner}}")
      .split("#6EC6E8").join("{{accent}}");
  }
})();

function tokensOf(st) {
  const p = st.palette || state.palette;
  return {
    ink: p.ink, corner: p.corner, accent: p.accent,
    body: p.body, scene: p.scene, panel: p.panel || GEOMETRY.colors.panel,
    blush: p.blush, fluid: p.fluid,
  };
}
function applyTokens(fragment, tok) {
  let out = fragment;
  for (const [k, v] of Object.entries(tok)) out = out.split("{{" + k + "}}").join(v);
  return out;
}
function bodyPath() {
  const [W, H] = GEOMETRY.body, r = GEOMETRY.body_radius;
  return `M${r} 0H${W - r}A${r} ${r} 0 0 1 ${W} ${r}V${H - r}A${r} ${r} 0 0 1 ${W - r} ${H}H${r}A${r} ${r} 0 0 1 0 ${H - r}V${r}A${r} ${r} 0 0 1 ${r} 0Z`;
}
function cornerPath() {
  const [W, H] = GEOMETRY.body, r = GEOMETRY.body_radius;
  const [x1, y1] = GEOMETRY.corner[0], y2 = GEOMETRY.corner[1][1];
  return `M${x1} ${y1}H${W - r}A${r} ${r} 0 0 0 ${W} ${H - r}V${y2}Z`;
}

function composeSVG(st = state, animateIds = null) {
  const g = GEOMETRY, tok = tokensOf(st);
  const sh = g.shadow, parts = [];
  const wrap = (frag, id) => animateIds && animateIds.has(id) ? `<g class="anim">${frag}</g>` : frag;
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560">`);
  parts.push(`<defs>`
    + `<filter id="soft-shadow" filterUnits="userSpaceOnUse" x="-80" y="-80" width="760" height="540" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="${sh.blur_std_deviation}"/></filter>`
    + `<filter id="contact-shadow" filterUnits="userSpaceOnUse" x="-80" y="-80" width="760" height="540" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="${sh.contact.blur_std_deviation}"/></filter>`
    + `</defs>`);
  if (tok.scene) parts.push(`<rect x="0" y="0" width="780" height="560" fill="${tok.scene}"/>`);
  parts.push(`<g transform="translate(90 90)">`);
  parts.push(`<rect x="0" y="${sh.offset_y}" width="${g.body[0]}" height="${g.body[1]}" rx="${g.body_radius}" fill="${sh.color}" opacity="${sh.opacity}" filter="url(#soft-shadow)"/>`);
  parts.push(`<rect x="0" y="${sh.contact.offset_y}" width="${g.body[0]}" height="${g.body[1]}" rx="${g.body_radius}" fill="${sh.color}" opacity="${sh.contact.opacity}" filter="url(#contact-shadow)"/>`);
  parts.push(`<path d="${bodyPath()}" fill="${tok.body}"/>`);
  parts.push(`<path d="${cornerPath()}" fill="${tok.corner}"/>`);
  const ex = EXPRESSIONS.expressions.find(e => e.id === st.expression);
  if (ex) parts.push(wrap(applyTokens(ex.fragment, tok), ex.id));
  for (const id of st.decorations) {
    const d = DECORATIONS.find(x => x.id === id);
    if (d) parts.push(wrap(applyTokens(d.fragment, tok), id));
  }
  parts.push(`</g></svg>`);
  return parts.join("");
}

// ==================== 禁区与对比度校验（D-1~D-4 + Ⅱ级配色红线） ====================
const EYE_ZONES = [[123, 125, 213, 255], [261, 125, 351, 255]];
function cornerZoneHit(b) {
  const [x1, y1, x2, y2] = b;
  const inside = (x, y) => x >= 410 && x <= 600 && y >= 190 && y <= 380 && x + y >= 790;
  if (inside(x1, y1) || inside(x1, y2) || inside(x2, y1) || inside(x2, y2)) return true;
  for (const [vx, vy] of [[410, 380], [600, 380], [600, 190]])
    if (vx >= x1 && vx <= x2 && vy >= y1 && vy <= y2) return true;
  const lo = Math.max(410, x1), hi = Math.min(600, x2);
  if (lo <= hi && 790 - hi <= y2 && 790 - lo >= y1) return true;
  return false;
}
function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * f((n >> 16) & 255) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255);
}
function contrast(a, b) {
  if (!a || !b) return Infinity;
  const la = lum(a), lb = lum(b);
  return (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05);
}
function validate(st = state) {
  const warns = [];
  const boxesOf = (d) => d.bboxes ?? [d.bbox];
  const hit = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
  for (const id of st.decorations) {
    const d = DECORATIONS.find(x => x.id === id);
    for (const b of boxesOf(d)) {
      const [x1, y1, x2, y2] = b;
      if (cornerZoneHit(b)) warns.push(`${d.name} 疑似进入切角保护区（D-1）`);
      if (!d.covers_eyes) {
        for (const [ex1, ey1, ex2, ey2] of EYE_ZONES) {
          if (x1 < ex2 && x2 > ex1 && y1 < ey2 && y2 > ey1) { warns.push(`${d.name} 压到眼部区（D-3）`); break; }
        }
      }
      if (x1 < -78 || y1 < -78 || x2 > 678 || y2 > 458) warns.push(`${d.name} 超出画布安全区（D-4）`);
    }
  }
  // 规则 C-6：装饰互相叠压
  for (let i = 0; i < st.decorations.length; i++) {
    for (let j = i + 1; j < st.decorations.length; j++) {
      const a = DECORATIONS.find(x => x.id === st.decorations[i]);
      const b = DECORATIONS.find(x => x.id === st.decorations[j]);
      if (boxesOf(a).some(ba => boxesOf(b).some(bb => hit(ba, bb))))
        warns.push(`${a.name} 与 ${b.name} 同挂会互相叠压（C-6）`);
    }
  }
  // Ⅱ级配色对比度红线（自定义取色时最有用）
  const p = st.palette;
  if (contrast(p.body, p.ink) < 2.0) warns.push("眼睛与体色对比不足，形象会失去焦点");
  if (contrast(p.body, p.corner) < 1.25) warns.push("切角与体色过于接近，签名不可见");
  if (contrast(p.body, p.accent) < 1.25) warns.push("点缀色与体色过于接近，装饰难辨认");
  if (contrast(p.body, p.blush) < 1.25) warns.push("腮红与体色过于接近");
  if (contrast(p.body, p.fluid) < 1.25) warns.push("汗泪与体色过于接近");
  if (p.scene && contrast(p.scene, p.body) < 1.25) warns.push("体色与背景过于接近，小角浮不起来");
  return warns;
}

// ==================== UI ====================
function changedLayers() {
  const ids = new Set();
  if (prev.expression !== state.expression) ids.add(state.expression);
  for (const id of state.decorations) if (!prev.decorations.includes(id)) ids.add(id);
  return ids;
}

function render() {
  const anim = changedLayers();
  document.getElementById("stageBase").innerHTML = composeSVG(state, anim);

  const base = document.getElementById("stageBase");
  const scene = state.palette.scene;
  base.style.background = scene || "var(--wash)";
  base.classList.toggle("tex", !scene && texOn);
  document.getElementById("texToggle").style.visibility = scene ? "hidden" : "visible";

  const ex = EXPRESSIONS.expressions.find(e => e.id === state.expression);
  const decos = state.decorations.map(id => DECORATIONS.find(d => d.id === id).name);
  const p = state.palette;
  document.getElementById("filename").textContent =
    `小角-${ex.name}${decos.length ? "-" + decos.join("-") : ""}${p.name && p.id !== "original" && p.id !== "custom" ? "-" + p.name : ""}`;
  const warnings = validate();
  document.getElementById("warn").textContent =
    warnings.length ? "注意：" + warnings.join("；") : "";

  document.querySelectorAll(".tile[data-expr]").forEach(t =>
    t.classList.toggle("on", t.dataset.expr === state.expression));
  document.querySelectorAll(".tile[data-deco]").forEach(t =>
    t.classList.toggle("on", state.decorations.includes(t.dataset.deco)));
  document.querySelectorAll(".colorway[data-cw]").forEach(c =>
    c.classList.toggle("on", c.dataset.cw === p.id));

  // 配色变化 → 所有瓦片缩略图与品牌标跟随当前配色重渲
  const pk = paletteKey(p);
  if (pk !== prev.paletteKey) {
    document.querySelectorAll(".brand-mark, .tile .art").forEach(el => {
      const expr = el.closest(".tile") ? (el.closest(".tile").dataset.expr || "expr-01-standard") : "expr-01-standard";
      const deco = el.closest(".tile") ? el.closest(".tile").dataset.deco : null;
      el.innerHTML = composeSVG({ expression: expr, decorations: deco ? [deco] : [], palette: p });
    });
  }

  prev = { expression: state.expression, decorations: [...state.decorations], paletteKey: pk };
  save();
}

function makeTile(attrs, name) {
  const b = document.createElement("button");
  b.className = "tile";
  for (const [k, v] of Object.entries(attrs)) b.dataset[k] = v;
  b.innerHTML = `<span class="art"></span><span class="name">${name}</span>`;
  return b;
}

function buildUI() {
  document.getElementById("brandMark").innerHTML = composeSVG(state);
  const count = EXPRESSIONS.expressions.length
    * (DECORATIONS.filter(d => d.group === "head-top").length + 1)
    * (DECORATIONS.filter(d => d.group === "eyes").length + 1)
    * (DECORATIONS.filter(d => d.group === "neck").length + 1)
    * Math.pow(2, DECORATIONS.filter(d => d.group.startsWith("float")).length)
    * COLORWAYS.length;
  document.getElementById("comboCount").innerHTML =
    `组合空间 <b>${count.toLocaleString("zh-Hans-CN")}</b> 种 · 另支持自定义取色`;

  const exprBox = document.getElementById("exprTiles");
  for (const e of EXPRESSIONS.expressions) {
    const t = makeTile({ expr: e.id }, e.name);
    t.onclick = () => { state.expression = e.id; render(); };
    exprBox.appendChild(t);
  }

  const decoBox = document.getElementById("decoGroups");
  for (const g of DECO_GROUPS) {
    const label = document.createElement("div");
    label.className = "group-label"; label.textContent = g.label;
    decoBox.appendChild(label);
    const grid = document.createElement("div");
    grid.className = "tiles";
    const members = g.members
      ? DECORATIONS.filter(d => g.members.includes(d.group))
      : DECORATIONS.filter(d => d.group === g.id);
    for (const d of members) {
      const t = makeTile({ deco: d.id }, d.name);
      t.onclick = () => {
        const had = state.decorations.includes(d.id);
        state.decorations = state.decorations.filter(id =>
          id !== d.id && DECORATIONS.find(x => x.id === id).group !== d.group);
        if (!had) state.decorations.push(d.id);
        render();
      };
      grid.appendChild(t);
    }
    decoBox.appendChild(grid);
  }

  // 配色卡：三段色带 = 体色 / 切角 / 点缀
  const cwBox = document.getElementById("colorwayCards");
  for (const c of COLORWAYS) {
    const b = document.createElement("button");
    b.className = "colorway"; b.dataset.cw = c.id;
    b.innerHTML = `<span class="sw">`
      + `<i style="height:52%;background:${c.body}"></i>`
      + `<i style="height:28%;background:${c.corner}"></i>`
      + `<i style="height:20%;background:${c.accent}"></i></span>`
      + `<span class="name">${c.name}</span>`;
    b.onclick = () => { setPalette({ ...c }); };
    cwBox.appendChild(b);
  }

  // 自定义取色
  const bind = (id, key) => {
    document.getElementById(id).addEventListener("input", e => {
      setPalette({ ...state.palette, id: "custom", name: "自定义", [key]: e.target.value });
    });
  };
  bind("pickBody", "body"); bind("pickCorner", "corner"); bind("pickInk", "ink");
  bind("pickAccent", "accent"); bind("pickScene", "scene");
  document.getElementById("btnClearScene").onclick = () => {
    setPalette({ ...state.palette, id: "custom", name: "自定义", scene: null });
  };
}

function setPalette(p) {
  state.palette = normalizePalette(p);
  syncPickers();
  render();
}
function normalizePalette(p) {
  const base = COLORWAYS.find(c => c.id === p?.id) || COLORWAYS[0];
  return {
    ...base,
    ...(p || {}),
    id: p?.id || base.id,
    name: p?.name || base.name,
    blush: p?.blush || base.blush,
    fluid: p?.fluid || base.fluid,
    panel: p?.panel || base.panel,
  };
}
function syncPickers() {
  const p = state.palette;
  document.getElementById("pickBody").value = p.body;
  document.getElementById("pickCorner").value = p.corner;
  document.getElementById("pickInk").value = p.ink;
  document.getElementById("pickAccent").value = p.accent;
  document.getElementById("pickScene").value = p.scene || "#C8CAC7";
}

// ==================== 随机与导出 ====================
function randomCombo() {
  const exprs = EXPRESSIONS.expressions;
  let ex; do { ex = exprs[Math.floor(Math.random() * exprs.length)]; } while (exprs.length > 1 && ex.id === state.expression);
  state.expression = ex.id;
  const pick = (arr, p) => (Math.random() < p ? arr[Math.floor(Math.random() * arr.length)].id : null);
  const byGroup = g => DECORATIONS.filter(d => d.group === g);
  state.decorations = [
    pick(byGroup("head-top"), 0.55), pick(byGroup("eyes"), 0.35), pick(byGroup("neck"), 0.3),
    pick(byGroup("float-right"), 0.22), pick(byGroup("float-left"), 0.18),
  ].filter(Boolean);
  const kept = [];
  const hit = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
  for (const id of state.decorations) {
    const d = DECORATIONS.find(x => x.id === id);
    const boxes = d.bboxes ?? [d.bbox];
    if (!kept.some(k => boxes.some(ba => (k.bboxes ?? [k.bbox]).some(bb => hit(ba, bb))))) kept.push(d);
  }
  state.decorations = kept.map(d => d.id);
  setPalette({ ...COLORWAYS[Math.floor(Math.random() * COLORWAYS.length)] });
}
function fname() {
  const ex = EXPRESSIONS.expressions.find(e => e.id === state.expression);
  const decos = state.decorations.map(id => DECORATIONS.find(d => d.id === id).name);
  const p = state.palette;
  const cw = p.id && p.id !== "original" && p.id !== "custom" ? "-" + p.name : "";
  return `小角-${ex.name}${decos.length ? "-" + decos.join("-") : ""}${cw}`;
}
function download(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  setExportStatus(`已导出 ${name}`, false);
}
function setExportStatus(message, error = false) {
  const el = document.getElementById("exportStatus");
  if (!el) return;
  el.textContent = message;
  el.className = "export-status " + (error ? "error" : "ok");
}
function exportSVG() {
  download(fname() + ".svg", new Blob([composeSVG()], { type: "image/svg+xml" }));
}
function exportPNG(size) {
  const url = URL.createObjectURL(new Blob([composeSVG()], { type: "image/svg+xml" }));
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = size; c.height = Math.round(size * 560 / 780);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b => download(fname() + `-${size}px.png`, b), "image/png");
  };
  img.onerror = () => { URL.revokeObjectURL(url); setExportStatus("PNG 导出失败，请用本地服务器打开页面后重试", true); };
  img.src = url;
}

// ==================== 本地记忆 ====================
function save() {
  try { localStorage.setItem("xj-state", JSON.stringify({
    expression: state.expression, decorations: state.decorations, palette: state.palette,
  })); } catch (e) { /* file:// 下可能受限，静默降级 */ }
}
function load() {
  try {
    const raw = localStorage.getItem("xj-state");
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.expression && EXPRESSIONS.expressions.some(e => e.id === s.expression)) state.expression = s.expression;
    if (Array.isArray(s.decorations)) state.decorations = s.decorations.filter(id => DECORATIONS.some(d => d.id === id));
    if (s.palette && s.palette.body) {
      const known = COLORWAYS.find(c => c.id === s.palette.id && paletteKey(c) === paletteKey(s.palette));
      state.palette = normalizePalette(known ? { ...known } : { ...s.palette, id: s.palette.id || "custom", name: s.palette.name || "自定义" });
    }
  } catch (e) { /* 忽略坏数据 */ }
}

document.getElementById("btnSvg").onclick = exportSVG;
document.getElementById("btnRandom").onclick = randomCombo;
document.getElementById("btnClearDeco").onclick = () => {
  state.decorations = [];
  render();
};
document.getElementById("btnReset").onclick = () => {
  state.expression = "expr-01-standard"; state.decorations = [];
  setPalette({ ...COLORWAYS[0] });
};
document.getElementById("texToggle").onclick = (e) => {
  texOn = !texOn; e.currentTarget.style.color = texOn ? "" : "var(--hairline)"; render();
};
document.querySelectorAll("[data-png]").forEach(b => b.onclick = () => exportPNG(+b.dataset.png));
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "r" || e.key === "R") { randomCombo(); return; }
  const n = "123456789".indexOf(e.key) >= 0 ? Number(e.key) : e.key === "0" ? 10 : null;
  if (n && EXPRESSIONS.expressions[n - 1]) {
    state.expression = EXPRESSIONS.expressions[n - 1].id; render();
  }
});

load();
buildUI();
syncPickers();
render();
</script>
</body>
</html>
