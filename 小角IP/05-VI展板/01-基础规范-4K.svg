20" font-weight="400" fill="#222222">#222222</ns0:text><ns0:rect x="1326" y="229" width="150" height="136" rx="14" fill="#D44A36" /><ns0:text x="1326" y="404.9" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#222222">砖红</ns0:text><ns0:text x="1326" y="439.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#222222">#D44A36</ns0:text><ns0:rect x="1496" y="229" width="150" height="136" rx="14" fill="#C8CAC7" /><ns0:text x="1496" y="404.9" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#222222">主背景灰</ns0:text><ns0:text x="1496" y="439.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#222222">#C8CAC7</ns0:text><ns0:rect x="1666" y="229" width="150" height="136" rx="14" fill="#EDE4D3" /><ns0:text x="1666" y="404.9" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#222222">辅助浅米</ns0:text><ns0:text x="1666" y="439.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#222222">#EDE4D3</ns0:text><ns0:text x="986" y="484.2" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#606560">灰色为主背景；浅米为辅助；功能蓝 #6EC6E8 仅用于表情。</ns0:text><ns0:rect x="64" y="534" width="630" height="458" rx="20" fill="#FFFFFF" /><ns0:text x="94" y="583.3" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#222222">03  几何规范</ns0:text><ns0:g transform="translate(120 650) scale(0.42)"><ns0:rect x="0" y="8" width="600" height="380" rx="95" fill="#252825" opacity="0.14" filter="url(#soft-shadow)" /><ns0:rect x="0" y="2" width="600" height="380" rx="95" fill="#252825" opacity="0.045" filter="url(#contact-shadow)" /><ns0:path d="M95 0H505A95 95 0 0 1 600 95V 285A95 95 0 0 1 505 380H95A95 95 0 0 1 0 285V95A95 95 0 0 1 95 0Z" fill="#F3EBDF" /><ns0:path d="M410 380H505A95 95 0 0 0 600 285V190Z" fill="#D44A36" /><ns0:rect x="123.0" y="125.0" width="90" height="130" 