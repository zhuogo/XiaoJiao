<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="3840" height="2160"><ns0:defs><ns0:filter id="soft-shadow" filterUnits="userSpaceOnUse" x="-80" y="-80" width="760" height="540" color-interpolation-filters="sRGB"><ns0:feGaussianBlur stdDeviation="12" /></ns0:filter><ns0:filter id="contact-shadow" filterUnits="userSpaceOnUse" x="-80" y="-80" width="760" height="540" color-interpolation-filters="sRGB"><ns0:feGaussianBlur stdDeviation="2.5" /></ns0:filter></ns0:defs><ns0:rect width="1920" height="1080" fill="#FFFFFF" /><ns0:text x="64" y="100.2" font-family="Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#222222">小角</ns0:text><ns0:polyline points="232,50 232,113" fill="none" stroke="#ACB0AC" stroke-width="1" /><ns0:text x="264" y="96.0" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#222222">基础规范</ns0:text><ns0:text x="1789.5" y="97.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#222222">01 / 03</ns0:text><ns0:text x="64" y="1041.5" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#606560">小角 · 视觉形象规范</ns0:text><ns0:text x="1642.0" y="1041.5" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#606560">灰底 #C8CAC7 · 轻阴影</ns0:text><ns0:rect x="64" y="160" width="868" height="350" rx="20" fill="#FFFFFF" /><ns0:text x="94" y="209.3" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#222222">01  主标识</ns0:text><ns0:rect x="94" y="226" width="490" height="216" rx="14" fill="#FFFFFF" /><ns0:g transform="translate(187 238) scale(0.5066666666666667)"><ns0:rect x="0" y="8" width="600" height="380" rx="95" fill="#252825" opacity="0.14" filter="url(#soft-shadow)" /><ns0:rect x="0" y="2" width="600" height="380" rx="95" fill="#252825" opacity="0.045" filter="url(#contact-shadow)" /><ns0:path d="M95 0H505A95 95 0 0 1 600 95V 285A95 95 0 0 1 505 380H95A95 95 0 0 1 0 285V95A9