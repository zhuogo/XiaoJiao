s0:rect x="718" y="534" width="658" height="458" rx="20" fill="#FFFFFF" /><ns0:text x="748" y="583.3" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#222222">04  使用规范</ns0:text><ns0:polyline points="766,605 1078,605 1078,829 766,829 766,605" fill="none" stroke="#ACB0AC" stroke-width="1.5" /><ns0:g transform="translate(802 641) scale(0.4)"><ns0:rect x="0" y="8" width="600" height="380" rx="95" fill="#252825" opacity="0.14" filter="url(#soft-shadow)" /><ns0:rect x="0" y="2" width="600" height="380" rx="95" fill="#252825" opacity="0.045" filter="url(#contact-shadow)" /><ns0:path d="M95 0H505A95 95 0 0 1 600 95V 285A95 95 0 0 1 505 380H95A95 95 0 0 1 0 285V95A95 95 0 0 1 95 0Z" fill="#F3EBDF" /><ns0:path d="M410 380H505A95 95 0 0 0 600 285V190Z" fill="#D44A36" /><ns0:rect x="123.0" y="125.0" width="90" height="130" rx="45" fill="#222222" /><ns0:rect x="261.0" y="125.0" width="90" height="130" rx="45" fill="#222222" /></ns0:g><ns0:text x="791" y="864.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#222222">安全留白 ≥ 90</ns0:text><ns0:text x="1090" y="644.1" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#222222">主标识 ≥ 32 px</ns0:text><ns0:text x="1090" y="683.1" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#222222">64 px 以下</ns0:text><ns0:text x="1090" y="714.1" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#222222">使用圆点眼</ns0:text><ns0:g transform="translate(1102 749) scale(0.2)"><ns0:rect x="0" y="8" width="600" height="380" rx="95" fill="#252825" opacity="0.14" filter="url(#soft-shadow)" /><ns0:rect x="0" y="2" width="600" height="380" rx="95" fill="#252825" opacity="0.045" filter="url(#contact-shadow)" /><ns0:path d="M95 0H505A95 95 0 0 1 600 95V 285A95 95 0 0 1 505 380H95A95 95 0 0 1 0 285V95A95 95 0 0 1 95 0Z" fill="#F3EBDF" /><ns0:path d="M410 380H505A95 95 0 0 0 600 285V190Z" fill="#D44A36" /><ns0:circle cx="168" cy="190" r="45" fill="#222222" /><ns0:circle cx="306" cy="190" r="45" fill="#222222" /></ns0:g><ns0:text x="748" y="925.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#222222">轻阴影：向下 8 / 模糊 12 / 14%</ns0:text><ns0:text x="748" y="963.1" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#606560">允许轻阴影；禁止描边、拉伸、渐变</ns0:text><ns0:rect x="1400" y="534" width="456" height="458" rx="20" fill="#FFFFFF" /><ns0:text x="1430" y="583.3" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#222222">05  单色版</ns0:text><ns0:rect x="1430" y="613" width="396" height="140" rx="14" fill="#FFFFFF" /><ns0:g transform="translate(1526 618) scale(0.34)"><ns0:path d="M95 0H505A95 95 0 0 1 600 95V 285A95 95 0 0 1 505 380H95A95 95 0 0 1 0 285V95A95 95 0 0 1 95 0ZM168 125.0A45 45 0 0 1 213 170.0V 210.0A45 45 0 0 1 168 255.0A45 45 0 0 1 123 210.0V170.0A45 45 0 0 1 168 125.0ZM306 125.0A45 45 0 0 1 351 170.0V 210.0A45 45 0 0 1 306 255.0A45 45 0 0 1 261 210.0V170.0A45 45 0 0 1 306 125.0Z" fill="#222222" fill-rule="evenodd" /></ns0:g><ns0:text x="1598.0" y="789.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#222222">单色黑</ns0:text><ns0:rect x="1430" y="815" width="396" height="116" rx="14" fill="#222222" /><ns0:g transform="translate(1544 820) scale(0.28)"><ns0:path d="M95 0H505A95 95 0 0 1 600 95V 285A95 95 0 0 1 505 380H95A95 95 0 0 1 0 285V95A95 95 0 0 1 95 0ZM168 125.0A45 45 0 0 1 213 170.0V 210.0A45 45 0 0 1 168 255.0A45 45 0 0 1 123 210.0V170.0A45 45 0 0 1 168 125.0ZM306 125.0A45 45 0 0 1 351 170.0V 210.0A45 45 0 0 1 306 255.0A45 45 0 0 1 261 210.0V170.0A45 45 0 0 1 306 125.0Z" fill="#FFFFFF" fill-rule="evenodd" /></ns0:g><ns0:text x="1557.25" y="966.2" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#222222">单色白 · 眼睛镂空</ns0:text></ns0:svg>